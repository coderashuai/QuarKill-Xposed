plugins { id 'com.android.application' }
android {
    namespace 'dev.quark.kill'
    compileSdk 35
    defaultConfig { applicationId 'dev.quark.kill'; minSdk 26; targetSdk 28; versionCode 1; versionName '1.0' }
    // LSPosed module distributed outside Google Play; preserve target SDK compatibility.
    lint { disable 'ExpiredTargetSdkVersion' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82'; implementation 'com.google.zxing:core:3.5.3' }
